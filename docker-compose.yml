services:
  app:
    build: .
    container_name: ai-job-application-os
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./data/applications.db
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.2:3b}
      - USE_LLM=${USE_LLM:-true}
    volumes:
      - ./data:/app/data
